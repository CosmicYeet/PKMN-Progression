# Progression League — builds data/pools.json from your sheet + share links.
# Goes in your repo at:  .github/workflows/build-pools.yml
name: Build card pools

on:
  workflow_dispatch: {}                 # manual only; no scheduled or push-triggered builds

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save node-html-parser
      - run: node scripts/build-pools.mjs
      - name: Commit updated data
        run: |
          git config user.name  "pools-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/pools.json data/link-cache.json
          git diff --staged --quiet || git commit -m "Update card pools"
          git push
